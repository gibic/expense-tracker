services:
  db:
    image: postgres:17-alpine
    container_name: expens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expens
      POSTGRES_PASSWORD: expens
      POSTGRES_DB: expens
    ports:
      - "5432:5432"
    volumes:
      - expens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expens -d expens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  expens_pgdata:
